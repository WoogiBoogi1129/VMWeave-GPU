name: runtime-images

on:
  pull_request:
    paths:
      - images/**
      - runtime/shm/**
      - versions.lock.yaml
      - .dockerignore
      - .github/workflows/images.yml
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - images/**
      - runtime/shm/**
      - versions.lock.yaml
      - .dockerignore
      - .github/workflows/images.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [control-plane, worker, guest-artifacts]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Normalize image name and choose an immutable build tag
        id: image
        shell: bash
        run: |
          image_owner="${GITHUB_REPOSITORY_OWNER,,}"
          image_tag="$GITHUB_SHA"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            image_tag="$GITHUB_REF_NAME"
          fi
          echo "name=ghcr.io/${image_owner}/flyt-${{ matrix.target }}:${image_tag}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: images/flyt/Containerfile
          target: ${{ matrix.target }}
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.image.outputs.name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
