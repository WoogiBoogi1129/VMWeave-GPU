name: hami-dra-runtime-image
on:
  pull_request:
    paths: [runtime/hami-dra/**, images/hami-dra/**, tests/hami-dra/**, deploy/hami-dra/**, .github/workflows/hami-dra-image.yml]
  push:
    branches: [main]
    tags: ["v*"]
    paths: [runtime/hami-dra/**, images/hami-dra/**, tests/hami-dra/**, deploy/hami-dra/**, .github/workflows/hami-dra-image.yml]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image reference
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          tag="$GITHUB_SHA"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then tag="$GITHUB_REF_NAME"; fi
          echo "name=ghcr.io/${owner}/vmweave-hami-dra:${tag}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: images/hami-dra/Containerfile
          load: true
          tags: ${{ steps.image.outputs.name }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify installed library and atomic replacement
        run: python3 tests/hami-dra/test_image.py --engine docker --image '${{ steps.image.outputs.name }}'
      - name: Publish tested release image
        if: startsWith(github.ref, 'refs/tags/')
        run: docker push '${{ steps.image.outputs.name }}'
