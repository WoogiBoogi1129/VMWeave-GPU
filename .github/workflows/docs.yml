name: Documentation
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'legacy/docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'scripts/docs_hooks.py'
      - 'scripts/check-site.py'
      - 'scripts/check-repository.py'
      - 'scripts/check-doc-contracts.py'
      - 'scripts/operator/**'
      - 'scripts/run-evidence-smoke.py'
      - 'deploy/examples/vmweave/**'
      - 'charts/vmweave-operator/**'
      - '.github/workflows/docs.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - run: python scripts/check-repository.py
      - run: python scripts/check-doc-contracts.py
      - run: mkdocs build --strict
      - run: python scripts/check-site.py
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
