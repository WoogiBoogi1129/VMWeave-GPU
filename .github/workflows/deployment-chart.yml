name: deployment-chart
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  chart:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: azure/setup-helm@v4.3.0
        with: {version: v3.17.3}
      - run: pip install PyYAML
      - run: python3 -m unittest discover -s tests/deployment -v
      - name: Require release tag to match chart version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PYCODE'
          import os, yaml
          from pathlib import Path
          chart = yaml.safe_load(Path('charts/vmweave-operator/Chart.yaml').read_text())
          assert os.environ['RELEASE_TAG'] == 'v' + chart['version'], 'release tag/chart version mismatch'
          PYCODE
      - name: Package
        run: helm package charts/vmweave-operator --destination /tmp/charts
      - name: Publish chart
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          helm push /tmp/charts/*.tgz "oci://ghcr.io/${owner}/charts"
