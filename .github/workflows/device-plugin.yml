name: VMWeave guest device plugin
on:
  pull_request:
    paths: ['integrations/kubernetes-device-plugin/**', 'charts/vmweave-device-plugin/**', 'images/vmweave/DevicePlugin*.Containerfile', 'images/vmweave/Runtime.Containerfile', 'runtime/shm/**', 'tools/guest-smoke/**', 'tests/control/test_guest*.py', 'tests/integration/**', 'tests/path_optimization/**', 'scripts/test-shm-training.sh', '.dockerignore', '.github/workflows/device-plugin.yml']
  push:
    branches: [main, 'device-plugin/**']
    tags: ['device-plugin-v*']
    paths: ['integrations/kubernetes-device-plugin/**', 'charts/vmweave-device-plugin/**', 'images/vmweave/DevicePlugin*.Containerfile', 'images/vmweave/Runtime.Containerfile', 'runtime/shm/**', 'tools/guest-smoke/**', 'tests/control/test_guest*.py', 'tests/integration/**', 'tests/path_optimization/**', 'scripts/test-shm-training.sh', '.dockerignore', '.github/workflows/device-plugin.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version-file: integrations/kubernetes-device-plugin/go.mod
        cache-dependency-path: integrations/kubernetes-device-plugin/go.sum
    - uses: azure/setup-helm@v4.3.0
    - name: Unit and socket lifecycle tests
      working-directory: integrations/kubernetes-device-plugin
      run: |
        go test -race ./...
        go vet ./...
    - name: Broker status regression tests
      run: python3 -m unittest discover -s tests/control -p 'test_guest*.py' -v
    - name: Helm contract
      run: |
        helm lint charts/vmweave-device-plugin --set image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa --set librarySHA256=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa --set brokerGID=998
        python3 integrations/kubernetes-device-plugin/tests/check-packaging.py
    - name: Build and verify packages
      shell: bash
      run: |
        set -euo pipefail
        stage='image metadata'
        report_failure() {
          local rc=$?
          echo "::error title=Device Plugin package build::Stage: $stage (exit $rc)"
          tail -n 25 "$RUNNER_TEMP/device-plugin-build.log" | python3 -c 'import sys; text=sys.stdin.read().replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"); print("::error title=Package build output::" + text)'
          exit "$rc"
        }
        trap report_failure ERR
        exec > >(tee "$RUNNER_TEMP/device-plugin-build.log") 2>&1
        owner="${GITHUB_REPOSITORY_OWNER,,}"
        tag="$GITHUB_SHA"
        if [[ "$GITHUB_REF" == refs/tags/device-plugin-v* ]]; then
          tag="$GITHUB_REF_NAME"
          version="${tag#device-plugin-v}"
          test "$(helm show chart charts/vmweave-device-plugin | awk '/^version:/ {print $2}')" = "$version"
        fi
        prefix="ghcr.io/${owner}/vmweave-device-plugin"
        stage='plugin image'
        docker build -f images/vmweave/DevicePlugin.Containerfile --label org.opencontainers.image.revision="$GITHUB_SHA" --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" -t "$prefix:$tag" .
        stage='guest image and checksums'
        docker build -f images/vmweave/Runtime.Containerfile --target guest-artifacts --build-arg SOURCE_REVISION="$GITHUB_SHA" --label org.opencontainers.image.revision="$GITHUB_SHA" --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" -t "$prefix-guest:$tag" .
        docker run --rm "$prefix-guest:$tag" sh -ec 'cd /opt/vmweave/guest; sha256sum -c SHA256SUMS; test -f guest_status.py'
        stage='workload image and executables'
        docker build -f images/vmweave/DevicePluginWorkload.Containerfile --build-arg GUEST_IMAGE="$prefix-guest:$tag" --label org.opencontainers.image.revision="$GITHUB_SHA" --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" -t "$prefix-workload:$tag" .
        docker run --rm --entrypoint sh "$prefix-workload:$tag" -ec 'test -x /opt/vmweave/bin/sgemm; test -x /opt/vmweave/bin/guest-gpu-smoke; test -r /opt/vmweave/lib/libvmweave_guest.so'
        stage='chart package'
        helm package charts/vmweave-device-plugin --destination /tmp/plugin-chart
        if [[ "$GITHUB_REF" == refs/tags/device-plugin-v* ]]; then
          stage='release publication'
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$prefix:$tag"
          docker push "$prefix-guest:$tag"
          docker push "$prefix-workload:$tag"
          helm push /tmp/plugin-chart/vmweave-device-plugin-*.tgz "oci://ghcr.io/${owner}/charts"
          mkdir -p /tmp/release
          cp /tmp/plugin-chart/*.tgz /tmp/release/
          docker inspect "$prefix:$tag" "$prefix-guest:$tag" "$prefix-workload:$tag" > /tmp/release/images.json
          docker run --rm "$prefix-guest:$tag" sh -ec 'cd /opt/vmweave/guest; cat source-revision.txt; sha256sum libvmweave_guest.so' > /tmp/release/guest-identity.txt
          docker save "$prefix:$tag" "$prefix-guest:$tag" "$prefix-workload:$tag" | gzip -1 > /tmp/release/images.docker.tar.gz
          (cd /tmp/release; sha256sum images.json guest-identity.txt images.docker.tar.gz *.tgz > SHA256SUMS)
        fi
      env:
        GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - uses: actions/upload-artifact@v4
      if: startsWith(github.ref, 'refs/tags/device-plugin-v')
      with:
        name: device-plugin-release
        path: /tmp/release/*
        retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/device-plugin-v')
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: device-plugin-release
        path: release
    - name: Publish portable verified packages
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
        RELEASE_TAG: ${{ github.ref_name }}
      run: |
        cat > /tmp/notes.md <<'NOTES'
        Optional Kubernetes device plugin for VMWeave guests. Exposes one existing VM GPU quota as vmweave.io/gpu: 1; one concurrent CUDA client, no nested HAMi or quota subdivision.

        The portable image archive and Helm chart support installation without registry credentials. Check SHA256SUMS before loading the archive. images.json records registry digests and source labels; guest-identity.txt records the compatible guest library hash. See docs/guides/kubernetes-device-plugin.md for installation and recovery requirements.
        NOTES
        gh release create "$RELEASE_TAG" --verify-tag --latest=false --title "VMWeave Device Plugin ${RELEASE_TAG#device-plugin-}" --notes-file /tmp/notes.md release/*
