<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 468" role="img" aria-labelledby="title desc">
<title id="title">같은 노드에서의 VMWeave GPU 데이터 경로</title><desc id="desc">같은 GPU 노드의 사용자 namespace 안에서 virt-launcher의 Guest 라이브러리, 로컬 PVC의 공유 메모리, Worker가 요청과 응답을 주고받습니다. Worker의 CUDA dispatcher가 물리 GPU를 사용하며 HAMi가 Worker의 GPU 자원 정책을 적용합니다. 중앙 Controller는 CUDA 데이터 경로에 포함되지 않습니다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker><marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#0f766e"/></marker></defs>
<style>text{font-family:"Noto Sans KR",system-ui,sans-serif} .mono{font-family:ui-monospace,"DejaVu Sans Mono",monospace}</style>
<rect x="0" y="0" width="1080" height="468" rx="20" fill="#f8fafc" stroke="none" stroke-width="1.5"/>
<text x="32" y="43" font-size="25" fill="#0f172a" font-weight="750" text-anchor="start">GPU 실행 경로</text>
<text x="32" y="73" font-size="17" fill="#334155" font-weight="400" text-anchor="start">CUDA 요청과 응답은 같은 노드의 공유 메모리를 통과합니다.</text>
<rect x="24" y="98" width="1032" height="298" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="44" y="128" font-size="13" fill="#475569" font-weight="700" text-anchor="start">GPU NODE</text>
<rect x="42" y="143" width="810" height="231" rx="12" fill="#f0fdfa" stroke="#99d8c9" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="60" y="174" font-size="17" fill="#0f766e" font-weight="650" text-anchor="start">사용자 namespace · team-a</text>
<rect x="60" y="198" width="220" height="131" rx="12" fill="#fff" stroke="#b6dbd0" stroke-width="1.5"/>
<text x="170.0" y="235" font-size="20" fill="#0f172a" font-weight="700" text-anchor="middle">KubeVirt VM</text>
<text x="170.0" y="266" font-size="16" fill="#475569" font-weight="400" text-anchor="middle">virt-launcher / QEMU</text>
<text x="170.0" y="294" font-size="15" fill="#64748b" font-weight="400" text-anchor="middle">Guest CUDA library</text>
<rect x="328" y="198" width="220" height="131" rx="12" fill="#fff" stroke="#b6dbd0" stroke-width="1.5"/>
<text x="438.0" y="235" font-size="20" fill="#0f172a" font-weight="700" text-anchor="middle">공유 메모리</text>
<text x="438.0" y="266" font-size="16" fill="#475569" font-weight="400" text-anchor="middle">local filesystem PVC</text>
<text x="438.0" y="294" font-size="15" fill="#64748b" font-weight="400" text-anchor="middle">rings · payload</text>
<rect x="596" y="198" width="238" height="131" rx="12" fill="#fff" stroke="#b6dbd0" stroke-width="1.5"/>
<text x="715.0" y="235" font-size="20" fill="#0f172a" font-weight="700" text-anchor="middle">GPU Worker</text>
<text x="715.0" y="266" font-size="16" fill="#475569" font-weight="400" text-anchor="middle">CUDA dispatcher</text>
<text x="715.0" y="294" font-size="15" fill="#64748b" font-weight="400" text-anchor="middle">HAMi 자원 정책</text>
<path d="M287 263H321" fill="none" stroke="#0f766e" stroke-width="2" stroke-linejoin="round" marker-end="url(#teal)" marker-start="url(#teal)"/>
<path d="M555 263H589" fill="none" stroke="#0f766e" stroke-width="2" stroke-linejoin="round" marker-end="url(#teal)" marker-start="url(#teal)"/>
<text x="304" y="350" font-size="14" fill="#0f766e" font-weight="500" text-anchor="middle">ivshmem mapping</text>
<text x="572" y="350" font-size="14" fill="#0f766e" font-weight="500" text-anchor="middle">mmap</text>
<rect x="900" y="198" width="136" height="131" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="968" y="242" font-size="19" fill="#1e40af" font-weight="700" text-anchor="middle">물리 GPU</text>
<text x="968" y="276" font-size="16" fill="#475569" font-weight="400" text-anchor="middle">CUDA 실행</text>
<path d="M841 263H893" fill="none" stroke="#0f766e" stroke-width="2" stroke-linejoin="round" marker-end="url(#teal)" marker-start="url(#teal)"/>
<text x="32" y="427" font-size="16" fill="#0f766e" font-weight="600" text-anchor="start">녹색 양방향 화살표: 요청 / 응답 데이터 경로</text>
<text x="32" y="454" font-size="16" fill="#334155" font-weight="400" text-anchor="start">Controller는 backing·Worker·회수를 관리하며 CUDA 호출을 직접 실행하지 않습니다.</text>
