<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" role="img" aria-labelledby="title desc">
<title id="title">VMWeave-GPU architecture</title><desc id="desc">A KubeVirt VM sends CUDA requests through shared-memory rings to a Worker, which executes them through HAMi and CUDA. Kubernetes manages the channel lifecycle.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#0d9488"/></marker></defs>
<rect width="960" height="350" rx="16" fill="#f1f5f9"/>
<g font-family="system-ui,sans-serif" text-anchor="middle" fill="#0f172a">
<text x="480" y="36" font-size="15" font-weight="700">VMWeave-GPU · shared-memory execution on the same node</text>
<rect x="30" y="75" width="195" height="102" rx="10" fill="#fff" stroke="#94a3b8"/><text x="127" y="108" font-size="18" font-weight="700">KubeVirt VM</text><text x="127" y="138" font-size="14">CUDA interception</text><text x="127" y="159" font-size="12">Guest library</text>
<rect x="272" y="75" width="186" height="102" rx="10" fill="#ccfbf1" stroke="#0d9488"/><text x="365" y="108" font-size="18" font-weight="700">Shared memory</text><text x="365" y="138" font-size="14">Request / response rings</text><text x="365" y="159" font-size="12">Payload · ivshmem</text>
<rect x="505" y="75" width="188" height="102" rx="10" fill="#fff" stroke="#94a3b8"/><text x="599" y="108" font-size="18" font-weight="700">Worker</text><text x="599" y="138" font-size="14">CUDA dispatcher</text><text x="599" y="159" font-size="12">Session execution</text>
<rect x="740" y="75" width="190" height="102" rx="10" fill="#fff" stroke="#94a3b8"/><text x="835" y="108" font-size="18" font-weight="700">GPU</text><text x="835" y="138" font-size="14">HAMi / CUDA</text><text x="835" y="159" font-size="12">Resource policy</text>
<g stroke="#0d9488" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"><path d="M232 126H265"/><path d="M465 126H498"/><path d="M700 126H733"/></g>
<rect x="205" y="245" width="550" height="68" rx="10" fill="#e0e7ff" stroke="#818cf8"/><text x="480" y="274" font-size="17" font-weight="700">Kubernetes API · Channel Controller</text><text x="480" y="297" font-size="13">References · allocation · mapping evidence · drain / release</text>
<g stroke="#64748b" stroke-width="2" stroke-dasharray="5 5" fill="none"><path d="M290 245V211H127V184"/><path d="M480 245V211H365V184"/><path d="M665 245V211H599V184"/></g>
</g></svg>
