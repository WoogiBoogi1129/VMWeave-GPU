<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 800" role="img" aria-labelledby="title desc">
<title id="title">VMWeave 중앙 제어와 namespace별 리소스</title><desc id="desc">vmweave-system의 Go Controller와 Webhook이 Kubernetes API를 통해 등록된 team-a와 team-b를 관리합니다. KubeVirt는 별도 kubevirt namespace에서 VM 수명 주기를 관리합니다. 사용자 namespace에는 GPUProfile, GPURequest, SharedMemoryChannel, ChannelAttachment, VM, virt-launcher, Worker, helper Pod와 PVC가 있습니다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker><marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#0f766e"/></marker></defs>
<style>text{font-family:"Noto Sans KR",system-ui,sans-serif} .mono{font-family:ui-monospace,"DejaVu Sans Mono",monospace}</style>
<rect x="0" y="0" width="1080" height="800" rx="20" fill="#f8fafc" stroke="none" stroke-width="1.5"/>
<text x="32" y="42" font-size="26" fill="#0f172a" font-weight="750" text-anchor="start">VMWeave</text>
<text x="175" y="42" font-size="21" fill="#475569" font-weight="500" text-anchor="start">중앙 제어 · namespace별 워크로드</text>
<text x="32" y="72" font-size="17" fill="#334155" font-weight="400" text-anchor="start">제어기는 한 곳에, VM과 GPU 실행 리소스는 각 사용자의 namespace에 배치합니다.</text>
<rect x="32" y="100" width="648" height="208" rx="12" fill="#ecfdf5" stroke="#99d8c9" stroke-width="1.5"/>
