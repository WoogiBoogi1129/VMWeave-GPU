{{- if eq .Values.tls.mode "certManager" }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Release.Name }}-webhook
spec:
  secretName: {{ .Values.tls.existingSecret }}
  dnsNames:
  - {{ printf "%s-webhook.%s.svc" .Release.Name .Release.Namespace | quote }}
  duration: 2160h
  renewBefore: 360h
  privateKey:
    rotationPolicy: Always
  issuerRef:
    name: {{ required "tls.certManager.issuerRef.name required" .Values.tls.certManager.issuerRef.name | quote }}
    kind: {{ .Values.tls.certManager.issuerRef.kind }}
    group: {{ .Values.tls.certManager.issuerRef.group }}
{{- end }}
