{{- if .Values.webhook.registrationEnabled }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ .Release.Namespace }}-{{ .Release.Name }}
webhooks:
- name: validate.vmweave.io
  admissionReviewVersions: [v1]
  sideEffects: None
  failurePolicy: Fail
  timeoutSeconds: 10
  namespaceSelector:
    matchExpressions:
    - key: kubernetes.io/metadata.name
      operator: In
      values: {{ .Values.management.namespaces | toJson }}
  clientConfig:
    service: {namespace: {{ .Release.Namespace }}, name: {{ .Release.Name }}-webhook, path: /validate, port: 443}
    caBundle: {{ required "tls.caBundle required" .Values.tls.caBundle | quote }}
  rules:
  - apiGroups: [vmweave.io]
    apiVersions: [v1alpha1]
    operations: [CREATE, UPDATE]
    resources: [sharedmemorychannels]
    scope: Namespaced
  {{- if eq .Values.mode "active" }}
  - apiGroups: [vmweave.io]
    apiVersions: [v1alpha1]
    operations: [UPDATE]
    resources: [channelattachments/status]
    scope: Namespaced
  - apiGroups: [kubevirt.io]
    apiVersions: [v1]
    operations: [CREATE, UPDATE]
    resources: [virtualmachineinstances, virtualmachineinstancemigrations]
    scope: Namespaced
  {{- end }}
{{- end }}
